# Home Assistant add-on. Source: the private Stammbaum repo (homeassistant/addon-repo). On each release tag CI copies it
# to the public add-on repo and sets "version" from the tag, so the value here needs no maintenance.
name: Stammbaum
version: "0.1.57"
slug: stammbaum
description: Familienstammbaum mit Fotos, Ereignissen, Quellen, Zeitstrahl und Karte
url: https://github.com/vo5tr0/stammbaum-homeassistant
arch:
  - amd64
  - aarch64
image: ghcr.io/vo5tr0/stammbaum-homeassistant
startup: application
boot: auto
ingress: true
ingress_port: 8000
panel_icon: mdi:family-tree
panel_title: Stammbaum
# SQLite database: stop the add-on briefly during a backup so the copy is consistent.
backup: cold
options:
  tree_name: Familie
  default_role: reader
  admins: []
  geocoding: true
schema:
  tree_name: str
  default_role: list(reader|editor)
  admins:
    - str
  geocoding: bool
